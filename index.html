  <style>
    * {

    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f0f9ff, #e0f2fe);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;

      background: rgba(255, 255, 255, 0.96);
      padding: 35px;

      border-radius: 20px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;

      color: #1e3a8a;
      font-size: 26px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    input {
      flex: 1;

      padding: 12px 15px;

      font-size: 16px;

      border: 2px solid #cbd5e1;
      border-radius: 10px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-btn {
      padding: 12px 20px;

      font-size: 16px;
      font-weight: bold;

      color: white;
      background: #2563eb;

      border: none;
      border-radius: 10px;

      cursor: pointer;

      transition: 0.2s;
    }

    .search-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 25px;
    }

    .success-text {
      color: #334155;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .result-image {
      max-width: 100%;
      width: 350px;

      border-radius: 12px;

      border: 2px solid #e2e8f0;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);

      transition: 0.25s;
    }

    .result-image:hover {
      transform: scale(1.02);
    }

    /* Nút tải ảnh */
    .download-btn {
      display: inline-block;

      margin-top: 18px;

      padding: 12px 22px;

      background: #16a34a;
      color: white;

      border: none;
      border-radius: 10px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .download-btn:hover {
      background: #15803d;
      transform: translateY(-2px);
    }

    .download-btn:disabled {
      background: #94a3b8;
      cursor: wait;
      transform: none;
    }

    .error {
      padding: 12px;

      color: #b91c1c;
      background: #fee2e2;

      border-radius: 10px;

      font-weight: bold;
    }

    .footer {
      margin-top: 25px;

      font-size: 13px;
      color: #94a3b8;
    }

    @media (max-width: 500px) {

      .container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 22px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-btn {
        width: 100%;
      }

      .result-image {
        width: 100%;
      }
    }
  </style>

    // =====================================
    // HIỂN THỊ ẢNH
    // =====================================

    function showImage() {

      const id =
        document.getElementById("userId").value.trim();

      const resultDiv =
        document.getElementById("result");


      // Chưa nhập MSSV
      if (!id) {

        resultDiv.innerHTML = `
          <div class="error">
            ⚠️ Vui lòng nhập MSSV
          </div>
        `;

        return;
      }


      // Có MSSV
      if (images[id]) {

        resultDiv.innerHTML = `

          </div>

          <img
            id="resultImage"
            class="result-image"
            src="${images[id]}"
            alt="Ảnh cho MSSV ${id}"
          >

          <br>

          <button
            class="download-btn"
            onclick="downloadImage('${images[id]}', '${id}')"
          >
            ⬇️ Tải ảnh xuống
          </button>

        `;

      }

      // Không tìm thấy
      else {

        resultDiv.innerHTML = `

          <div class="error">
            ❌ Không tìm thấy MSSV: ${id}
          </div>

        `;

      }

    }


    // =====================================
    // HÀM TẢI ẢNH
    // =====================================

    async function downloadImage(url, id) {

      const button =
        document.querySelector(".download-btn");

      // Đổi trạng thái nút
      button.disabled = true;
      button.innerText = "⏳ Đang tải...";


      try {

        // Lấy ảnh từ URL
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Không thể tải ảnh");
        }

        // Chuyển ảnh thành file Blob
        const blob = await response.blob();

        // Tạo URL tạm thời
        const blobUrl =
          window.URL.createObjectURL(blob);


        // Tạo thẻ <a> để tải
        const link =
          document.createElement("a");

        link.href = blobUrl;

        link.download = `MSSV-${id}.png`;

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        // Xóa URL tạm
        window.URL.revokeObjectURL(blobUrl);


        // Khôi phục nút
        button.disabled = false;
        button.innerText = "✅ Đã tải ảnh";

        setTimeout(() => {
          button.innerText = "⬇️ Tải ảnh xuống";
        }, 2000);

      }

      catch (error) {

        console.error(error);

        button.disabled = false;
        button.innerText = "⬇️ Tải ảnh xuống";

        alert(
          "Không thể tải ảnh trực tiếp. " +
          "Trình duyệt có thể đang chặn việc tải ảnh từ máy chủ này."
        );

      }

    }


    // =====================================
    // NHẤN ENTER ĐỂ TRA CỨU
    // =====================================

    document
      .getElementById("userId")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          showImage();
        }

      });
